<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login | Fresh Basket Malaysia</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f5f7f5;
}

header{
background:#0f8f4f;
padding:15px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
}

.logo i{
margin-right:8px;
}

nav ul{
list-style:none;
display:flex;
gap:25px;
}

nav a{
color:white;
text-decoration:none;
font-weight:600;
}

.login-container{
min-height:80vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px 20px;
}

.login-card{
background:white;
width:100%;
max-width:500px;
padding:40px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.login-card h1{
text-align:center;
color:#0f8f4f;
margin-bottom:10px;
}

.login-card p{
text-align:center;
color:#666;
margin-bottom:30px;
}

.form-group{
margin-bottom:20px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}

.form-group input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

.login-btn{
width:100%;
padding:14px;
border:none;
background:#0f8f4f;
color:white;
font-size:16px;
font-weight:bold;
border-radius:8px;
cursor:pointer;
}

.login-btn:hover{
background:#0c7440;
}

.message{
margin-top:15px;
text-align:center;
color:green;
font-weight:bold;
}

footer{
background:#0f8f4f;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header>

<div class="logo">
<i class="fa-solid fa-basket-shopping"></i>
Fresh Basket
</div>

<nav>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="products.html">Products</a></li>
<li><a href="cart.html">Cart</a></li>
</ul>
</nav>

</header>

<div class="login-container">

<div class="login-card">

<h1>Customer Login</h1>

<p>Login to continue shopping with Fresh Basket Malaysia.</p>

<div class="form-group">
<label>Full Name</label>
<input type="text" id="fullName" placeholder="Enter your full name">
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email">
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" placeholder="Enter your password">
</div>

<button class="login-btn" onclick="loginCustomer()">
Login
</button>

<p class="message" id="message"></p>

</div>

</div>

<footer>
© 2026 Fresh Basket Malaysia. All Rights Reserved.
</footer>

<script>

function loginCustomer(){

const name=document.getElementById("fullName").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value.trim();

if(name==="" || email==="" || password===""){

alert("Please fill in all fields.");
return;

}

localStorage.setItem("customerName",name);
localStorage.setItem("customerEmail",email);
localStorage.setItem("customerPassword",password);

document.getElementById("message").innerText=
"Login Successful! Redirecting...";

setTimeout(()=>{

window.location.href="index.html";

},1500);

}

</script>

</body>
</html>
